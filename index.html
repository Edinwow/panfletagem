<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Panfletagem</title>
<link rel="stylesheet" href="vendor/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4e9de;--paper-dim:#c9b9a6;
    --oxblood:#1a0d0c;--oxblood-2:#26130f;--panel:#22110f;--panel-edge:#4a1512;
    --red:#d61f1f;--red-bright:#ff4b3e;--red-deep:#8f1010;
    --wheat:#e3b23c;--wheat-dim:#a67e2a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--oxblood);color:var(--paper);overflow:hidden;-webkit-tap-highlight-color:transparent}

  header{position:fixed;top:0;left:0;right:0;z-index:1200;display:flex;align-items:center;gap:12px;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
    background:linear-gradient(180deg,rgba(20,8,7,.97),rgba(20,8,7,.82) 70%,rgba(20,8,7,0));pointer-events:none}
  header .star{pointer-events:auto;width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 0 2px var(--wheat),0 4px 14px rgba(0,0,0,.5)}
  header .titles{pointer-events:auto;line-height:1}
  header h1{font-family:"Oswald",sans-serif;font-weight:700;font-size:19px;letter-spacing:.5px;margin:0;color:var(--paper)}
  header h1 b{color:var(--red-bright)}
  header .sub{font-size:11px;color:var(--paper-dim);margin-top:3px;letter-spacing:.3px}

  #map{position:absolute;inset:0;background:#0e0605}
  .leaflet-container{background:#0e0605;font-family:inherit}
  .leaflet-control-attribution{background:rgba(20,8,7,.7)!important;color:#8a7a6c!important;font-size:9px}
  .leaflet-control-attribution a{color:#a9927f!important}
  .leaflet-bar a{background:var(--panel);color:var(--paper);border-color:#3a1210!important}
  .leaflet-bar a:hover{background:#301715}


  .panel{position:fixed;z-index:1100;left:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);width:230px;max-width:calc(100vw - 24px);
    background:linear-gradient(180deg,var(--panel),var(--oxblood-2));border:1px solid var(--panel-edge);border-left:4px solid var(--red);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);padding:12px}
  .panel h2{font-family:"Oswald",sans-serif;font-size:12px;letter-spacing:1.5px;color:var(--wheat);margin:0 0 9px;font-weight:600}
  .stat{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:var(--paper-dim)}
  .stat b{font-family:"Oswald",sans-serif;font-size:15px;color:var(--paper)}
  .stat.n-done b{color:var(--red-bright)}

  .locate{position:fixed;z-index:1100;right:16px;bottom:calc(env(safe-area-inset-bottom) + 92px);width:52px;height:52px;border-radius:50%;border:1px solid var(--panel-edge);cursor:pointer;background:var(--panel);color:var(--paper);font-size:22px;box-shadow:0 6px 16px rgba(0,0,0,.5)}
  .cancelsel{position:fixed;z-index:1100;left:50%;top:calc(env(safe-area-inset-top) + 108px);transform:translateX(-50%);white-space:nowrap;background:transparent;color:var(--paper-dim);border:1px solid var(--panel-edge);font-family:"Oswald",sans-serif;font-weight:600;font-size:12px;letter-spacing:.4px;padding:7px 14px;border-radius:20px;cursor:pointer}
  .cancelsel:active{background:#301715}
  .locate:active{transform:scale(.94)}

  .hint{position:fixed;z-index:1100;left:50%;top:calc(env(safe-area-inset-top) + 66px);transform:translateX(-50%);white-space:nowrap;background:var(--wheat);color:#1a0d0c;font-family:"Oswald",sans-serif;font-weight:600;font-size:13px;letter-spacing:.4px;padding:8px 16px;border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.5);display:none}
  .hint.actionable{background:var(--red);color:#fff;cursor:pointer}

  .scrim{position:fixed;inset:0;z-index:1500;background:rgba(8,3,3,.6);display:none;backdrop-filter:blur(2px)}
  .sheet{position:fixed;z-index:1600;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--panel),var(--oxblood));border-top:4px solid var(--red);border-radius:16px 16px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.6);padding:14px 16px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(110%);transition:transform .26s cubic-bezier(.2,.8,.2,1);max-height:86vh;overflow:auto}
  .sheet.open{transform:translateY(0)}
  .grab{width:44px;height:4px;background:#5a2a26;border-radius:4px;margin:2px auto 12px}
  .sheet h3{font-family:"Oswald",sans-serif;font-weight:700;font-size:20px;margin:0 0 3px;letter-spacing:.5px}
  .sheet .coord{font-size:11px;color:var(--paper-dim);margin-bottom:14px}
  label.fld{display:block;font-size:11px;letter-spacing:1px;color:var(--wheat);margin:14px 0 6px;font-family:"Oswald",sans-serif;font-weight:600}
  input[type=text],input[type=date]{width:100%;background:#160a09;border:1px solid #3a1210;border-radius:9px;color:var(--paper);font-size:16px;padding:12px;font-family:inherit}
  input:focus{outline:none;border-color:var(--red)}
  .actions{display:flex;gap:10px;margin-top:20px}
  .btn{flex:1;padding:14px;border-radius:10px;border:0;cursor:pointer;font-family:"Oswald",sans-serif;font-weight:700;font-size:15px;letter-spacing:.5px}
  .btn.primary{background:var(--red);color:#fff}
  .btn.primary:active{background:var(--red-deep)}
  .btn.ghost{background:transparent;color:var(--paper-dim);border:1px solid #3a1210}
  .btn.danger{background:transparent;color:var(--red-bright);border:1px solid var(--red-deep)}

  .evlist{margin:6px 0 4px;border-top:1px solid #3a1210}
  .ev{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid #2a1210}
  .ev .tag{font-family:"Oswald",sans-serif;font-weight:700;font-size:11px;letter-spacing:.5px;padding:4px 9px;border-radius:20px;flex:0 0 auto}
  .ev .tag.panfletada{background:var(--red);color:#fff}
  .ev .d{flex:1;font-size:14px}
  .ev .d small{display:block;color:var(--paper-dim);font-size:11px;margin-top:2px}
  .ev .x{background:transparent;border:0;color:#7a5a54;font-size:20px;cursor:pointer;padding:4px 8px}
  .ev .x:active{color:var(--red-bright)}
  .addbtn{width:100%;margin-top:12px;padding:13px;border-radius:10px;cursor:pointer;background:#160a09;border:1px dashed var(--red-deep);color:var(--red-bright);font-family:"Oswald",sans-serif;font-weight:700;font-size:14px;letter-spacing:.5px}
  .detmeta{display:flex;gap:16px;margin:2px 0 12px;font-size:12px;color:var(--paper-dim)}
  .detmeta b{color:var(--paper);font-family:"Oswald",sans-serif;font-size:15px}

  .toast{position:fixed;z-index:2000;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;background:#160a09;border:1px solid var(--panel-edge);border-left:4px solid var(--red);color:var(--paper);font-size:13px;padding:11px 16px;border-radius:9px;max-width:88vw;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  #loading{position:fixed;inset:0;z-index:3000;background:var(--oxblood);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  #loading .star{width:60px;height:60px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 0 0 3px var(--wheat);animation:pulse 1.1s ease-in-out infinite}
  #loading p{font-family:"Oswald",sans-serif;letter-spacing:1px;color:var(--paper-dim);font-size:13px}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

  .banner{position:fixed;z-index:1400;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 62px);background:#3a1210;border:1px solid var(--red-deep);color:#f0d9d9;border-radius:9px;padding:10px 12px;font-size:12px;display:none}
  .banner b{color:#fff}

  @media (min-width:760px){
    header h1{font-size:22px}header .sub{font-size:12px}
    .panel{width:250px}
    .sheet{left:auto;right:24px;bottom:24px;width:420px;border-radius:16px;border-top:0;border-left:4px solid var(--red);transform:translateX(130%)}
    .sheet.open{transform:translateX(0)}
    .grab{display:none}
  }
</style>
</head>
<body>

<div id="loading"><div class="star">&#9773;</div><p>Carregando&hellip;</p></div>

<header>
  <div class="star">&#9773;</div>
  <div class="titles">
    <h1><b>Panfletagem</b></h1>
    <div class="sub">Humberto Matos</div>
  </div>
</header>

<div id="map"></div>

<div class="hint" id="hint">Toque nas ruas para marcar</div>
<div class="banner" id="banner"></div>

<div class="panel" id="panel">
  <h2>Camadas</h2>
  <div class="stat n-done"><span>Ruas panfletadas</span><b id="cDone">0</b></div>
  <div class="stat"><span>Total de panfletagens</span><b id="cTotal">0</b></div>
</div>

<button class="locate" id="locate" title="Minha localização">&#9678;</button>
<button class="cancelsel" id="cancelSel" style="display:none">Cancelar seleção</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="vendor/leaflet.min.js"></script>
<script>
(function(){
  "use strict";

  /* ---------- config / backend ---------- */
  var CFG = window.PANFLETO_CONFIG || {};
  var ONLINE = !!(CFG.url && CFG.key);
  var API = ONLINE ? CFG.url.replace(/\/+$/,"") + "/rest/v1/panfletagens" : null;
  function H(extra){
    return Object.assign({ "apikey":CFG.key, "Authorization":"Bearer "+CFG.key, "Content-Type":"application/json" }, extra||{});
  }
  function enc(s){ return encodeURIComponent(s); }

  var store;
  if(ONLINE){
    store = {
      selectAll: async function(){ var r=await fetch(API+"?select=*&order=created_at.asc",{headers:H()}); if(!r.ok) throw new Error(r.status); return r.json(); },
      insert: async function(row){ var r=await fetch(API,{method:"POST",headers:H({"Prefer":"return=minimal"}),body:JSON.stringify(row)}); if(!r.ok) throw new Error(r.status); },
      updateById: async function(id,patch){ var r=await fetch(API+"?id=eq."+enc(id),{method:"PATCH",headers:H({"Prefer":"return=minimal"}),body:JSON.stringify(patch)}); if(!r.ok) throw new Error(r.status); },
      updateByPonto: async function(pid,patch){ var r=await fetch(API+"?ponto_id=eq."+enc(pid),{method:"PATCH",headers:H({"Prefer":"return=minimal"}),body:JSON.stringify(patch)}); if(!r.ok) throw new Error(r.status); },
      deleteById: async function(id){ var r=await fetch(API+"?id=eq."+enc(id),{method:"DELETE",headers:H()}); if(!r.ok) throw new Error(r.status); },
      deletePonto: async function(pid){ var r=await fetch(API+"?ponto_id=eq."+enc(pid),{method:"DELETE",headers:H()}); if(!r.ok) throw new Error(r.status); }
    };
  }else{
    var localRows=[];
    store = {
      selectAll: async function(){ return localRows.slice(); },
      insert: async function(row){ localRows.push(Object.assign({id:uid(),created_at:new Date().toISOString()},row)); },
      updateById: async function(id,patch){ var x=localRows.find(function(r){return r.id===id;}); if(x) Object.assign(x,patch); },
      updateByPonto: async function(pid,patch){ localRows.filter(function(r){return r.ponto_id===pid;}).forEach(function(r){Object.assign(r,patch);}); },
      deleteById: async function(id){ localRows=localRows.filter(function(r){return r.id!==id;}); },
      deletePonto: async function(pid){ localRows=localRows.filter(function(r){return r.ponto_id!==pid;}); }
    };
  }

  /* ---------- state ---------- */
  var rows=[], points=[];
  var map, streetLayer, candidateLayer;
  var selected={};
  var SELECT_MIN_ZOOM=14;

  /* ---------- helpers ---------- */
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function todayISO(){ var d=new Date(),o=d.getTimezoneOffset(); return new Date(d.getTime()-o*60000).toISOString().slice(0,10); }
  function fmt(iso){ if(!iso) return "sem data"; var p=iso.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
  function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove("show");},2600); }
  function escapeHtml(s){ return (s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function countDone(p){ return p.eventos.filter(function(e){return e.tipo==="panfletada";}).length; }
  function visible(p){ return p.eventos.length>0; }

  function buildPoints(rws){
    var m={};
    rws.forEach(function(r){
      var k=r.ponto_id;
      if(!m[k]) m[k]={ id:k, ponto_id:k, rua:r.rua, lat:r.lat, lng:r.lng, geom:r.geom||null, eventos:[] };
      m[k].eventos.push({ id:r.id, tipo:r.tipo, data:r.data, pessoa:r.pessoa });
      if(r.rua) m[k].rua=r.rua;
      if(r.geom && !m[k].geom) m[k].geom=r.geom;
    });
    return Object.keys(m).map(function(k){return m[k];});
  }

  async function reloadAndRender(){
    try{
      rows = await store.selectAll();
      points = buildPoints(rows);
      render();
      if(ONLINE){ var b=document.getElementById("banner"); if(b.dataset.err){ b.style.display="none"; b.dataset.err=""; } }
    }catch(e){
      if(ONLINE){
        var b2=document.getElementById("banner");
        b2.dataset.err="1"; b2.style.display="block";
        b2.innerHTML="Não consegui conectar ao banco. Confira a URL e a chave em <b>config.js</b> e as políticas (RLS) no Supabase.";
      }
    }
  }

  /* ---------- map ---------- */
  function initMap(){
    map=L.map("map",{zoomControl:false,attributionControl:true,tap:true,preferCanvas:true,minZoom:6,maxZoom:19,maxBounds:[[-34.35,-58.25],[-26.5,-49.1]],maxBoundsViscosity:0.8}).setView([-30.0346,-51.2177],13);
    L.control.zoom({position:"bottomright"}).addTo(map);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",{
      maxZoom:19,maxNativeZoom:16,attribution:'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ'
    }).addTo(map);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}",{
      maxZoom:19,maxNativeZoom:16
    }).addTo(map);
    map.createPane("candPane"); map.getPane("candPane").style.zIndex=410;
    map.createPane("streetPane"); map.getPane("streetPane").style.zIndex=420;
    streetLayer=L.layerGroup().addTo(map);
    candidateLayer=L.layerGroup().addTo(map);
    var moveTimer;
    map.on("moveend",function(){ clearTimeout(moveTimer); moveTimer=setTimeout(updateStreets,250); });
    map.on("click",function(e){
      if(map.getZoom()<SELECT_MIN_ZOOM) return;
      var id=findNearestWay(e.latlng);
      if(id) toggleSelect(id);
    });
    fetch("vendor/rs.geojson").then(function(r){return r.json();}).then(function(rs){
      var world=[[85,-180],[85,180],[-85,180],[-85,-180]];
      var holes=rs.geometry.coordinates.map(function(poly){
        return poly[0].map(function(c){return [c[1],c[0]];});
      });
      L.polygon([world].concat(holes),{stroke:false,fillColor:"#0e0605",fillOpacity:0.82,interactive:false}).addTo(map);
    }).catch(function(){});
  }

  function render(){
    var done=0,total=0;
    points.forEach(function(p){ var d=countDone(p); if(d>0)done++; total+=d; });
    document.getElementById("cDone").textContent=done;
    document.getElementById("cTotal").textContent=total;
    streetLayer.clearLayers();
    points.filter(visible).forEach(function(p){
      if(!p.geom || p.geom.length<2) return;
      var d=countDone(p);
      var style={color:"#ff4b3e",weight:Math.min(5+d*2,16),opacity:0.9,pane:"streetPane"};
      var layer=L.polyline(p.geom,style);
      layer.on("click",function(ev){ L.DomEvent.stopPropagation(ev); openDetail(p.id); });
      streetLayer.addLayer(layer);
    });
  }

  /* ---------- seleção de segmentos (ruas pré-carregadas por cidade) ---------- */
  var selStyle={color:"#ff4b3e",weight:11,opacity:0.95,pane:"candPane"};
  var allWays={};
  var loadedCities={};
  var manifest=null;
  var CLICK_TOLERANCE_PX=16;

  function boundsIntersect(a,b){
    return a[0]<=b[2] && a[2]>=b[0] && a[1]<=b[3] && a[3]>=b[1];
  }

  async function ensureCitiesLoaded(){
    if(!manifest){
      try{ manifest=await (await fetch("vendor/streets/manifest.json")).json(); }catch(e){ manifest=[]; }
    }
    var b=map.getBounds();
    var mb=[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()];
    var toLoad=manifest.filter(function(c){ return c.file && !loadedCities[c.id] && boundsIntersect(c.bbox,mb); });
    if(!toLoad.length) return;
    await Promise.all(toLoad.map(async function(c){
      loadedCities[c.id]=true;
      try{
        var ways=await (await fetch(c.file)).json();
        ways.forEach(function(w){
          var lats=w.geom.map(function(p){return p[0];}), lngs=w.geom.map(function(p){return p[1];});
          allWays[w.id]={id:w.id,rua:w.rua,geom:w.geom,bounds:[Math.min.apply(null,lats),Math.min.apply(null,lngs),Math.max.apply(null,lats),Math.max.apply(null,lngs)]};
        });
      }catch(e){ delete loadedCities[c.id]; }
    }));
  }

  async function updateStreets(){
    await ensureCitiesLoaded();
    updateHint();
  }

  function distToSegment(p,a,b){
    var dx=b.x-a.x, dy=b.y-a.y;
    var lenSq=dx*dx+dy*dy;
    var t=lenSq?((p.x-a.x)*dx+(p.y-a.y)*dy)/lenSq:0;
    t=Math.max(0,Math.min(1,t));
    var cx=a.x+t*dx, cy=a.y+t*dy, ddx=p.x-cx, ddy=p.y-cy;
    return Math.sqrt(ddx*ddx+ddy*ddy);
  }

  function findNearestWay(latlng){
    var clickPt=map.latLngToContainerPoint(latlng);
    var buf=0.003;
    var best=null, bestDist=CLICK_TOLERANCE_PX;
    Object.keys(allWays).forEach(function(id){
      var w=allWays[id];
      if(w.bounds[0]-buf>latlng.lat || w.bounds[2]+buf<latlng.lat || w.bounds[1]-buf>latlng.lng || w.bounds[3]+buf<latlng.lng) return;
      for(var i=0;i<w.geom.length-1;i++){
        var a=map.latLngToContainerPoint(w.geom[i]);
        var b=map.latLngToContainerPoint(w.geom[i+1]);
        var d=distToSegment(clickPt,a,b);
        if(d<bestDist){ bestDist=d; best=id; }
      }
    });
    return best;
  }

  function toggleSelect(id){
    if(selected[id]){
      candidateLayer.removeLayer(selected[id].layer);
      delete selected[id];
    }else{
      var w=allWays[id]; if(!w) return;
      var layer=L.polyline(w.geom,selStyle);
      layer.on("click",function(ev){ L.DomEvent.stopPropagation(ev); toggleSelect(id); });
      candidateLayer.addLayer(layer);
      selected[id]={id:id,rua:w.rua,geom:w.geom,layer:layer};
    }
    updateHint();
  }

  function updateHint(){
    var hint=document.getElementById("hint"), cancelBtn=document.getElementById("cancelSel");
    var n=Object.keys(selected).length;
    if(map.getZoom()<SELECT_MIN_ZOOM){ hint.style.display="none"; hint.classList.remove("actionable"); cancelBtn.style.display="none"; return; }
    hint.style.display="block";
    cancelBtn.style.display=n>0?"block":"none";
    if(n>0){ hint.textContent="Confirmar "+n+" rua"+(n>1?"s":"")+" selecionada"+(n>1?"s":""); hint.classList.add("actionable"); }
    else { hint.textContent="Toque nas ruas para marcar"; hint.classList.remove("actionable"); }
  }

  function openConfirmForm(){
    var segs=Object.keys(selected).map(function(k){return selected[k];});
    var n=segs.length, data=todayISO();
    var h='<div class="grab"></div><h3>Registrar '+n+' rua'+(n>1?"s":"")+'</h3>';
    h+='<div class="coord">'+segs.map(function(s){return escapeHtml(s.rua);}).join(", ")+'</div>';
    h+='<label class="fld">Data em que panfletei</label><input type="date" id="f_data" value="'+data+'">';
    h+='<label class="fld">Quem panfletou (opcional)</label><input type="text" id="f_pessoa" placeholder="Ex.: Maria" value="">';
    h+='<div class="actions"><button class="btn ghost" id="f_cancel">Cancelar</button><button class="btn primary" id="f_save">Salvar</button></div>';
    openSheet(h);

    document.getElementById("f_cancel").addEventListener("click",closeSheet);
    document.getElementById("f_save").addEventListener("click",function(){ submitSegments(segs); });
  }

  async function submitSegments(segs){
    var dataEl=document.getElementById("f_data"), pessoaEl=document.getElementById("f_pessoa");
    var data=dataEl.value, pessoa=pessoaEl.value.trim();
    if(!data){ toast("Escolha uma data."); return; }
    try{
      await Promise.all(segs.map(function(s){
        var mid=s.geom[Math.floor(s.geom.length/2)];
        return store.insert({ ponto_id:s.id, rua:s.rua, lat:mid[0], lng:mid[1], tipo:"panfletada", data:data, pessoa:pessoa||null, geom:s.geom });
      }));
      toast("Rua(s) marcada(s) como panfletada(s).");
      closeSheet();
      candidateLayer.clearLayers();
      selected={};
      await reloadAndRender();
    }catch(e){ toast("Não foi possível salvar. Tente de novo."); }
  }

  /* ---------- sheet ---------- */
  var scrim=document.getElementById("scrim"), sheet=document.getElementById("sheet");
  function openSheet(html){ sheet.innerHTML=html; scrim.style.display="block"; requestAnimationFrame(function(){ sheet.classList.add("open"); }); }
  function closeSheet(){ sheet.classList.remove("open"); scrim.style.display="none"; }
  scrim.addEventListener("click",closeSheet);

  var formState=null;
  function openForm(opts){
    formState=opts;
    var p=opts.pointId?points.find(function(x){return x.id===opts.pointId;}):null;
    var ev=opts.eventId&&p?p.eventos.find(function(x){return x.id===opts.eventId;}):null;
    var data=ev?ev.data:todayISO();
    var pessoa=ev?(ev.pessoa||""):"";
    var rua=p?p.rua:"";
    var title,showRuaInput,showType;
    if(opts.mode==="addEvent"){ title="Registrar panfletagem"; showRuaInput=false; showType=true; }
    else if(opts.mode==="editEvent"){ title="Editar registro"; showRuaInput=false; showType=true; }
    else { title="Renomear rua"; showRuaInput=true; showType=false; }

    var h='<div class="grab"></div><h3>'+title+'</h3>';
    h+='<div class="coord">'+escapeHtml(rua)+'</div>';
    if(showRuaInput){ h+='<label class="fld">Nome da rua / bairro</label><input type="text" id="f_rua" placeholder="Ex.: Av. Borges de Medeiros" value="'+escapeHtml(rua)+'">'; }
    if(showType){
      h+='<label class="fld">Data em que panfletei</label><input type="date" id="f_data" value="'+data+'">';
      h+='<label class="fld">Quem panfletou (opcional)</label><input type="text" id="f_pessoa" placeholder="Ex.: Maria" value="'+escapeHtml(pessoa)+'">';
    }
    h+='<div class="actions"><button class="btn ghost" id="f_cancel">Cancelar</button><button class="btn primary" id="f_save">Salvar</button></div>';
    openSheet(h);

    document.getElementById("f_cancel").addEventListener("click",closeSheet);
    document.getElementById("f_save").addEventListener("click",function(){ submitForm(); });
  }

  async function submitForm(){
    var o=formState;
    var ruaEl=document.getElementById("f_rua"), dataEl=document.getElementById("f_data"), pessoaEl=document.getElementById("f_pessoa");
    var rua=ruaEl?ruaEl.value.trim():null;
    var data=dataEl?dataEl.value:null;
    var pessoa=pessoaEl?pessoaEl.value.trim():null;
    if(dataEl && !data){ toast("Escolha uma data."); return; }
    try{
      if(o.mode==="addEvent"){
        var p=points.find(function(x){return x.id===o.pointId;});
        await store.insert({ ponto_id:p.ponto_id, rua:p.rua, lat:p.lat, lng:p.lng, tipo:"panfletada", data:data, pessoa:pessoa||null });
        toast("Mais uma panfletagem registrada.");
      }else if(o.mode==="editEvent"){
        await store.updateById(o.eventId,{ data:data, pessoa:pessoa||null });
        toast("Registro atualizado.");
      }else if(o.mode==="editPoint"){
        var p2=points.find(function(x){return x.id===o.pointId;});
        await store.updateByPonto(p2.ponto_id,{ rua:rua||"Rua sem nome" });
        toast("Nome atualizado.");
      }
      closeSheet();
      await reloadAndRender();
    }catch(e){ toast("Não foi possível salvar. Tente de novo."); }
  }

  function openDetail(pointId){
    var p=points.find(function(x){return x.id===pointId;});
    if(!p) return;
    var done=countDone(p);
    var evs=p.eventos.slice().sort(function(a,b){ return (b.data||"").localeCompare(a.data||""); });
    var h='<div class="grab"></div><h3>'+escapeHtml(p.rua)+'</h3>';
    h+='<div class="detmeta"><span><b>'+done+'</b> panfletada'+(done===1?"":"s")+'</span></div>';
    h+='<div class="evlist">';
    evs.forEach(function(e){
      h+='<div class="ev"><span class="tag '+e.tipo+'">Feita</span>'
        +'<span class="d" data-edit="'+e.id+'">'+fmt(e.data)+(e.pessoa?" &middot; "+escapeHtml(e.pessoa):"")+'<small>toque para editar</small></span>'
        +'<button class="x" data-del="'+e.id+'" title="Remover">&times;</button></div>';
    });
    h+='</div><button class="addbtn" id="d_add">+ Registrar panfletagem aqui</button>';
    h+='<div class="actions"><button class="btn ghost" id="d_rename">Renomear</button><button class="btn danger" id="d_del">Excluir rua</button></div>';
    openSheet(h);

    document.getElementById("d_add").addEventListener("click",function(){ openForm({mode:"addEvent",pointId:p.id,tipo:"panfletada"}); });
    document.getElementById("d_rename").addEventListener("click",function(){ openForm({mode:"editPoint",pointId:p.id}); });
    document.getElementById("d_del").addEventListener("click",async function(){
      if(confirm("Excluir esta rua e todas as suas panfletagens? Isso afeta todos.")){
        try{ await store.deletePonto(p.ponto_id); closeSheet(); await reloadAndRender(); toast("Rua removida."); }
        catch(e){ toast("Erro ao excluir."); }
      }
    });
    sheet.querySelectorAll("[data-del]").forEach(function(b){
      b.addEventListener("click",async function(ev){
        ev.stopPropagation();
        try{
          await store.deleteById(b.getAttribute("data-del"));
          await reloadAndRender();
          var still=points.find(function(x){return x.id===p.id;});
          if(still) openDetail(p.id); else closeSheet();
        }catch(e){ toast("Erro ao remover registro."); }
      });
    });
    sheet.querySelectorAll("[data-edit]").forEach(function(el){
      el.addEventListener("click",function(){ openForm({mode:"editEvent",pointId:p.id,eventId:el.getAttribute("data-edit")}); });
    });
  }

  /* ---------- controls ---------- */
  document.getElementById("hint").addEventListener("click",function(){ if(Object.keys(selected).length>0) openConfirmForm(); });
  document.getElementById("cancelSel").addEventListener("click",function(){
    Object.keys(selected).forEach(function(id){ candidateLayer.removeLayer(selected[id].layer); });
    selected={};
    updateHint();
  });
  document.getElementById("locate").addEventListener("click",function(){
    if(!navigator.geolocation){ toast("Localização não suportada."); return; }
    toast("Localizando\u2026");
    navigator.geolocation.getCurrentPosition(function(pos){ map.setView([pos.coords.latitude,pos.coords.longitude],16); },
      function(){ toast("Não consegui a localização."); }, {enableHighAccuracy:true,timeout:8000});
  });

  /* ---------- boot ---------- */
  async function boot(){
    initMap();
    if(!ONLINE){
      var b=document.getElementById("banner");
      b.style.display="block";
      b.innerHTML="Modo local (teste): edite <b>config.js</b> com a URL e a chave do Supabase para salvar e compartilhar. Por enquanto nada é gravado.";
    }
    await reloadAndRender();
    await updateStreets();
    document.getElementById("loading").style.display="none";
    setTimeout(function(){ map.invalidateSize(); },200);
    if(ONLINE){
      setInterval(function(){ if(!sheet.classList.contains("open")) reloadAndRender(); },20000);
      window.addEventListener("focus",function(){ if(!sheet.classList.contains("open")) reloadAndRender(); });
    }
  }
  boot();
})();
</script>
</body>
</html>
